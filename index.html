<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Hlllc電子週報</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dflip/1.0.95/js/dflip.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/dflip/1.0.95/css/dflip.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/dflip/1.0.95/css/themify-icons.min.css">

  <style>
    body, html { margin:0; padding:0; height: 100%; background-color: #222; overflow: hidden; font-family: sans-serif; }
    #df_book_viewer { height: 100vh; width: 100vw; }
    .fallback-btn { 
      display: none; position: absolute; top: 50%; left: 50%; 
      transform: translate(-50%, -50%); color: white; text-align: center; 
    }
    .btn { 
      background: #00b900; color: white; padding: 15px 30px; 
      border-radius: 5px; text-decoration: none; display: inline-block; margin-top: 20px; 
    }
  </style>
</head>
<body>

  <div class="_df_book" source="weekly.pdf" id="df_book_viewer"></div>

  <div class="fallback-btn" id="fallback">
    <p>週報載入較慢</p>
    <a href="weekly.pdf" class="btn">點此直接打開週報</a>
  </div>

  <script>
    $(document).ready(function () {
      // 5秒偵測機制
      setTimeout(function(){
        if ($(".df-container").length === 0) {
          $("#fallback").show();
        }
      }, 5000);
    });
  </script>
</body>
</html>
