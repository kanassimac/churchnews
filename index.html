<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Hlllc電子週報</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/dflip/1.0.95/css/dflip.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/dflip/1.0.95/css/themify-icons.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dflip/1.0.95/js/dflip.min.js"></script>

  <style>
    body, html { margin:0; padding:0; height: 100%; background-color: #222; overflow: hidden; }
    #df_book_viewer { height: 100vh; width: 100vw; }
    .loading { color: #666; position: absolute; top: 50%; width: 100%; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body>

  <div class="loading" id="load-msg">電子週報啟動中...</div>

  <div id="df_book_viewer"></div>

  <script>
    $(document).ready(function () {
      var options = {
        source: "weekly.pdf", // 確保檔案就在隔壁
        webgl: true,          // 試著開啟 3D 加速
        height: "100%",
        duration: 800
      };
      
      // 手動啟動翻頁書
      $("#df_book_viewer").flipBook(options.source, options);
      
      // 3秒後移除提示字
      setTimeout(function(){ $("#load-msg").hide(); }, 3000);
    });
  </script>
</body>
</html>
